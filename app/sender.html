<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eight O'Clock Report Message Generator</title>
  <style>
    :root { color-scheme: dark; --navy:#07182c; --panel:#102741; --line:#31506f; --blue:#61b7ff; --text:#eef6ff; --muted:#abc0d3; }
    * { box-sizing: border-box; }
    body { margin:0; background:linear-gradient(135deg,#061221,#0b2542); color:var(--text); font:15px/1.5 system-ui,sans-serif; }
    main { width:min(1050px,calc(100% - 32px)); margin:32px auto; }
    h1 { margin-bottom:4px; } .lead { color:var(--muted); margin-top:0; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .card { background:rgba(16,39,65,.96); border:1px solid var(--line); border-radius:12px; padding:20px; box-shadow:0 14px 40px #0005; }
    label { display:block; font-weight:700; margin:12px 0 5px; }
    input, textarea, button { font:inherit; }
    input, textarea { width:100%; color:var(--text); background:#07182c; border:1px solid #456786; border-radius:7px; padding:10px; }
    textarea { min-height:245px; resize:vertical; font-family:ui-monospace,Consolas,monospace; font-size:13px; }
    #message { min-height:490px; }
    button { margin:14px 8px 0 0; padding:10px 15px; border:0; border-radius:7px; cursor:pointer; font-weight:750; background:var(--blue); color:#05203a; }
    button.secondary { background:#d5e5f3; }
    .note, #status { color:var(--muted); font-size:13px; }
    #status { min-height:20px; margin-top:10px; }
    .topline,.demo-bar,.message-actions { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .demo-bar { margin:16px 0; padding:12px; background:#173957; border:1px solid var(--line); border-radius:8px; }
    .virtual { background:#73e2a7; }
    .reset { background:transparent; color:var(--muted); border:1px solid var(--line); }
    @media (max-width:760px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<main>
  <div class="topline"><div><h1>Eight O'Clock Report Message Generator</h1><p class="lead">Package a single-ship Eight O'Clock Report as a verified, offline message.</p></div><button id="resetApp" class="reset">Reset entire demo</button></div>
  <div class="demo-bar"><span>Retrieve the Foundry export, then send the generated report to USS MAHAN.</span><button id="loadSample">2. Load Foundry export</button></div>
  <div class="grid">
    <section class="card">
      <label for="jsonFile">Eight O'Clock Report JSON</label>
      <input id="jsonFile" type="file" accept=".json,application/json">
      <label for="json">JSON data</label>
      <textarea id="json" spellcheck="false" placeholder="Import an Eight O'Clock Report JSON file."></textarea>
      <p class="note">Use <code>examples/eight-oclock-report.json</code>. All rows must belong to the ship named in the report.</p>
      <label for="asOf">Data as of</label>
      <input id="asOf" type="datetime-local">
      <label for="subject">Subject</label>
      <input id="subject" value="USS MAHAN (DDG 72) EIGHT O'CLOCK REPORT">
      <label for="body">Message body</label>
      <textarea id="body">Commanding Officer's Eight O'Clock Report follows.

This message contains a single-ship operational summary. Open the offline Eight O'Clock Report viewer and import the complete message.</textarea>
      <button id="generate">Generate message</button>
    </section>
    <section class="card">
      <div class="message-actions"><button id="sendToShip" class="virtual">3. Send to ship</button></div>
      <label for="message">Generated message</label>
      <textarea id="message" readonly spellcheck="false" placeholder="The complete message will appear here."></textarea>
      <button id="copy" class="secondary">Copy</button>
      <button id="download" class="secondary">Download .txt</button>
      <div id="status" role="status"></div>
    </section>
  </div>
</main>
<script src="./shared/browser-foundation.js"></script>
<script src="./shared/virtual-drive.js"></script>
<script src="./sender/browser-app.js"></script>
</body>
</html>
