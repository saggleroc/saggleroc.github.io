<!DOCTYPE html>

<title>USS MAHAN (DDG 72) Readiness Dashboard</title>

<style>
  :root {
    --navy:#08233b; --blue:#1878aa; --green:#197344; --amber:#a85f00;
    --red:#b42318; --ink:#172b39; --muted:#637783; --line:#cad8df;
    --canvas:#eaf0f3; --paper:#fff; --soft-blue:#eef7fb; --soft-green:#e9f5ed;
    --soft-amber:#fff4df; --soft-red:#fff0ef;
  }

  * { box-sizing:border-box; }

  body {
    margin:0; min-width:1080px; color:var(--ink); background:var(--canvas);
    font:13px/1.35 Arial, Helvetica, sans-serif;
  }

  .controls {
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px;
    padding:11px 24px; color:#fff; background:var(--navy);
    box-shadow:0 2px 9px rgba(0,0,0,.20);
  }

  .controls strong { font-size:14px; }
  .controls span { color:#bdd5e4; font-size:11px; }

  .controls button {
    margin-left:auto; padding:8px 13px; color:#fff; cursor:pointer; background:var(--blue);
    border:0; border-radius:4px; font:inherit; font-weight:700;
  }

  .controls button:hover { background:#10618e; }

  .nav { display:flex; gap:4px; }

  .nav a {
    padding:5px 7px; color:#d1e3ee; border-radius:3px; font-size:10px;
    font-weight:700; text-decoration:none;
  }

  .nav a:hover { color:#fff; background:rgba(255,255,255,.13); }

  .report { width:10.5in; margin:16px auto 28px; }

  .page {
    position:relative; width:10.5in; height:7.95in; overflow:hidden;
    margin:0 auto 16px; padding:.22in .28in; background:var(--paper);
    box-shadow:0 2px 12px rgba(12,35,52,.18);
    break-after:page; page-break-after:always;
  }

  .page:last-child { break-after:auto; page-break-after:auto; }

  .page-header {
    display:flex; align-items:flex-end; justify-content:space-between;
    min-height:.50in; padding-bottom:.08in; border-bottom:3px solid var(--blue);
  }

  .brand { color:var(--navy); font-size:20px; font-weight:800; }

  .brand small {
    display:block; margin-top:2px; color:var(--muted); font-size:9px;
    letter-spacing:.55px; text-transform:uppercase;
  }

  .ship-id { color:var(--navy); text-align:right; }
  .ship-id strong { display:block; font-size:17px; }
  .ship-id span { color:var(--muted); font-size:9px; }

  .footer {
    position:absolute; right:.28in; bottom:.11in; left:.28in;
    display:flex; justify-content:space-between; padding-top:4px;
    color:#75858d; background:#fff; border-top:1px solid var(--line); font-size:7.5px;
  }

  .section-title {
    margin:9px 0 6px; color:var(--navy); font-size:12px; font-weight:800;
    letter-spacing:.35px; text-transform:uppercase;
  }

  .grid { display:grid; gap:8px; }
  .overview-top { grid-template-columns:2.05fr 1fr; }
  .overview-bottom { grid-template-columns:1.08fr 1.32fr .94fr; margin-top:8px; }
  .department-top { grid-template-columns:repeat(5,1fr); }
  .department-mid { grid-template-columns:.82fr 1.18fr; }
  .department-bottom { grid-template-columns:1.08fr .92fr; }

  .panel {
    overflow:hidden; background:#fff; border:1px solid var(--line); border-radius:4px;
  }

  .panel-header {
    display:flex; align-items:center; justify-content:space-between; min-height:28px;
    padding:6px 8px; background:#f2f7f9; border-bottom:1px solid var(--line);
  }

  .panel-header h3 {
    margin:0; color:var(--navy); font-size:10px; font-weight:800;
    letter-spacing:.28px; text-transform:uppercase;
  }

  .panel-header span { color:var(--muted); font-size:8px; }
  .panel-body { padding:7px 8px; }

  .kpi-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }

  .kpi {
    min-height:67px; padding:8px 9px; background:#fff; border:1px solid var(--line);
    border-top:4px solid #8ca0ac; border-radius:4px;
  }

  .kpi.good { border-top-color:var(--green); }
  .kpi.watch { border-top-color:var(--amber); }
  .kpi.bad { border-top-color:var(--red); }

  .kpi-label {
    min-height:22px; color:var(--muted); font-size:8px; font-weight:800;
    letter-spacing:.32px; line-height:1.18; text-transform:uppercase;
  }

  .kpi-value { margin-top:4px; color:var(--navy); font-size:22px; font-weight:800; line-height:1; }
  .kpi-note { margin-top:3px; color:var(--muted); font-size:8px; }

  .readiness { display:flex; align-items:center; gap:9px; }

  .ring {
    position:relative; display:grid; place-items:center; width:88px; height:88px;
    flex:0 0 88px; border-radius:50%;
  }

  .ring::before {
    position:absolute; width:64px; height:64px; content:""; background:#fff; border-radius:50%;
  }

  .ring strong { position:relative; z-index:1; color:var(--navy); font-size:22px; }

  .ring span {
    position:relative; z-index:1; display:block; margin-top:-17px; color:var(--muted);
    font-size:7px; font-weight:800; text-align:center; text-transform:uppercase;
  }

  .readiness-copy { color:var(--muted); font-size:9px; }
  .readiness-copy strong { display:block; margin-bottom:4px; color:var(--navy); font-size:11px; }

  .dept-row {
    display:grid; grid-template-columns:35px 1fr 33px 28px; gap:5px;
    align-items:center; margin:6px 0; font-size:8px;
  }

  .dept-row strong { color:var(--navy); }

  .track { height:8px; overflow:hidden; background:#e4ecef; border-radius:10px; }
  .fill { height:100%; border-radius:10px; }
  .metric { color:var(--navy); font-weight:800; text-align:right; }

  .heatmap {
    display:grid; grid-template-columns:36px repeat(5,1fr); gap:3px; align-items:center; font-size:7px;
  }

  .heat-head { color:var(--muted); font-size:7px; font-weight:800; text-align:center; }
  .heat-label { color:var(--navy); font-weight:800; }

  .heat {
    height:16px; border-radius:2px; font-size:7px; font-weight:800;
    line-height:16px; text-align:center;
  }

  .good-bg { color:#155c34; background:#c9e8d0; }
  .watch-bg { color:#855000; background:#f9dda0; }
  .bad-bg { color:#90251c; background:#f3c0bb; }
  .neutral-bg { color:#566a75; background:#e9eef1; }

  .priority {
    display:grid; grid-template-columns:18px 1fr; gap:6px; padding:5px 0;
    border-bottom:1px solid #e5ecef;
  }

  .priority:last-child { border-bottom:0; }

  .priority-number {
    display:grid; place-items:center; width:18px; height:18px; color:#fff;
    background:var(--red); border-radius:50%; font-size:8px; font-weight:800;
  }

  .priority strong { display:block; color:var(--navy); font-size:8px; }
  .priority span { color:var(--muted); font-size:7px; }

  .stat {
    min-height:56px; padding:7px 8px; border:1px solid var(--line);
    border-left:5px solid var(--blue); border-radius:3px;
  }

  .stat.good { border-left-color:var(--green); }
  .stat.watch { border-left-color:var(--amber); }
  .stat.bad { border-left-color:var(--red); }

  .stat label {
    display:block; color:var(--muted); font-size:7px; font-weight:800;
    letter-spacing:.3px; text-transform:uppercase;
  }

  .stat strong {
    display:block; margin-top:3px; color:var(--navy); font-size:18px; line-height:1;
  }

  .stat span { color:var(--muted); font-size:7px; }

  .manning-row {
    display:grid; grid-template-columns:65px 1fr 35px; gap:6px; align-items:center;
    margin:7px 0; font-size:8px;
  }

  .manning-row strong { color:var(--navy); }

  .manning-bar {
    position:relative; height:13px; overflow:hidden; background:#e5edef; border-radius:2px;
  }

  .manning-ba {
    position:absolute; top:0; bottom:0; left:0; background:#9db8c5;
  }

  .manning-cob {
    position:absolute; top:3px; bottom:3px; left:0; background:var(--blue);
  }

  .nec-row {
    display:grid; grid-template-columns:42px 1fr 35px; gap:5px; align-items:center;
    margin:2px 0; font-size:7px;
  }

  .nec-row strong { color:var(--navy); text-transform:uppercase; }

  .nec-stack {
    display:flex; height:8px; overflow:hidden; background:#e6edef; border-radius:2px;
  }

  .nec-filled { background:var(--green); }
  .nec-gap { background:var(--red); }

  .tag {
    display:inline-block; min-width:22px; padding:2px 3px; border-radius:9px;
    font-size:6px; font-weight:800; text-align:center;
  }

  .tag.good { color:#155c34; background:#d8f0df; }
  .tag.watch { color:#855000; background:#fff0ca; }
  .tag.bad { color:#90251c; background:#fde0de; }
  .tag.neutral { color:#526672; background:#e8eef1; }

  .concern {
    margin-bottom:4px; padding:5px 6px; background:#f9fbfc; border:1px solid #d7e2e7;
    border-left:4px solid var(--amber); border-radius:2px;
  }

  .concern.c3, .concern.c4 { border-left-color:var(--red); }

  .concern-head {
    display:flex; justify-content:space-between; gap:8px; color:var(--navy);
    font-size:8px; font-weight:800;
  }

  .concern-copy {
    margin:2px 0 3px; overflow:hidden; color:var(--muted); font-size:6.7px;
    line-height:1.1; text-overflow:ellipsis; white-space:nowrap;
  }

  .chain {
    display:grid; grid-template-columns:1.2fr 10px 1.1fr 10px 1.1fr;
    gap:4px; align-items:stretch;
  }

  .chain-box {
    min-height:29px; padding:3px; background:#fff; border:1px solid var(--line);
    border-radius:2px; font-size:6.3px;
  }

  .chain-box strong {
    display:block; margin-bottom:1px; color:var(--navy); font-size:6.5px;
  }

  .chain-arrow {
    display:grid; place-items:center; color:var(--blue); font-size:12px; font-weight:800;
  }

  .linked { color:#155c34; background:var(--soft-green); border-color:#b5d9c0; }
  .related { color:#82500a; background:var(--soft-amber); border-color:#efd293; }
  .unlinked { color:#7b2d28; background:var(--soft-red); border-color:#ebc1be; }

  .mission-summary {
    display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin-bottom:4px;
  }

  .mission-summary-box {
    min-height:35px; padding:4px 5px; border:1px solid var(--line);
    border-top:3px solid var(--blue); border-radius:3px;
  }

  .mission-summary-box.good { border-top-color:var(--green); }
  .mission-summary-box.watch { border-top-color:var(--amber); }
  .mission-summary-box.bad { border-top-color:var(--red); }

  .mission-summary-box label {
    display:block; color:var(--muted); font-size:6px; font-weight:800;
    letter-spacing:.2px; text-transform:uppercase;
  }

  .mission-summary-box strong {
    display:block; margin-top:2px; color:var(--navy); font-size:13px; line-height:1;
  }

  .mission-summary-bar {
    display:flex; height:7px; overflow:hidden; background:#e6edef; border-radius:9px;
  }

  .mission-summary-bar span { height:100%; }

  table { width:100%; border-collapse:collapse; font-size:7px; }

  th {
    padding:4px; color:#4b6471; background:#edf4f6; border-bottom:1px solid var(--line);
    font-size:6.5px; letter-spacing:.25px; text-align:left; text-transform:uppercase;
  }

  td {
    padding:3px 4px; border-bottom:1px solid #e4ecef; vertical-align:top;
  }

  .right { text-align:right; }
  .center { text-align:center; }

  .legend {
    display:flex; flex-wrap:wrap; gap:7px; margin-top:4px; color:var(--muted); font-size:7px;
  }

  .legend i {
    display:inline-block; width:7px; height:7px; margin-right:2px; border-radius:50%;
  }

  .callout {
    padding:7px 8px; color:#4b626f; background:var(--soft-blue);
    border:1px solid #c8dfe9; border-left:4px solid var(--blue); font-size:8px;
  }

  .callout strong { color:var(--navy); }

  .empty {
    padding:14px; color:var(--muted); font-size:8px; font-style:italic; text-align:center;
  }

  /* Fixed department-page print layout. */
  .department-page { display:flex; flex-direction:column; }

  .department-page .department-top {
    flex:0 0 58px; margin:8px 0 7px;
  }

  .department-page .department-mid {
    flex:0 0 83px;
  }

  .department-page .department-mid .panel {
    height:83px;
  }

  .department-page .department-mid .panel-body {
    padding-top:5px; padding-bottom:4px;
  }

  .department-page .section-title {
    flex:0 0 19px; margin:7px 0 4px;
  }

  .department-page .chain-section {
    flex:0 0 296px;
  }

  .department-page .chain-section .panel {
    height:296px;
  }

  .department-page .chain-section .panel-body {
    height:266px; overflow:hidden; padding:5px 7px;
  }

  .department-page .department-bottom {
    flex:0 0 127px; margin-top:7px;
  }

  .department-page .department-bottom .panel {
    height:127px;
  }

  .department-page .department-bottom .panel-body {
    padding-top:4px; padding-bottom:3px;
  }

  /* Continuous appendix table. */
  .appendix-continuous {
    width:10.5in; min-height:7.5in; margin:16px auto 28px; padding:.22in .28in;
    background:#fff; box-shadow:0 2px 12px rgba(12,35,52,.18);
    break-before:page; page-break-before:always;
  }

  .appendix-continuous .page-header { margin-bottom:7px; }

  .appendix-continuous .footer {
    position:static; margin-top:7px;
  }

  .appendix-intro {
    margin:5px 0; padding:5px 7px; color:#4d626e; background:var(--soft-blue);
    border:1px solid #c8dfe9; border-left:4px solid var(--blue); font-size:7px;
  }

  .appendix-intro strong { color:var(--navy); }

  .appendix-table {
    table-layout:fixed; font-size:5.7px;
  }

  .appendix-table thead { display:table-header-group; }

  .appendix-table tr {
    break-inside:avoid; page-break-inside:avoid;
  }

  .appendix-table th {
    padding:3px 2px; font-size:5.5px; line-height:1.05;
  }

  .appendix-table td {
    padding:2px 3px; line-height:1.1; overflow-wrap:anywhere; vertical-align:top;
  }

  .appendix-table .source-col { width:9%; }
  .appendix-table .issue-col { width:17%; }
  .appendix-table .effect-col { width:22%; }
  .appendix-table .parts-col { width:20%; }
  .appendix-table .control-col { width:23%; }
  .appendix-table .status-col { width:9%; }

  .appendix-status {
    display:block; margin-top:1px; font-size:5.5px; font-weight:800;
  }

  .appendix-note {
    margin-top:5px; color:var(--muted); font-size:7px;
  }

  @page {
    size:letter landscape;
    margin:.25in;
  }

  @media print {
    body { min-width:0; background:#fff; }
    .controls { display:none; }
    .report { width:auto; margin:0; }
    .page { width:10.5in; height:7.95in; margin:0; box-shadow:none; }

    .appendix-continuous {
      width:auto; min-height:0; margin:0; padding:.22in .28in; box-shadow:none;
    }
  }
</style>

/* ============================================================
   HELPERS
   ============================================================ */

const TOTAL_PAGES = 6;
const byDept = (records, dept) => records.filter(r => r.dept === dept);
const significant = row => row.category === "C3" || row.category === "C4";
const gaps = rows => rows.filter(r => r.cob < r.ba);
const sum = values => values.reduce((a, b) => a + b, 0);

function fillPct(cob, ba) {
  return ba ? Math.round((cob / ba) * 100) : 0;
}

function statusForPercent(value) {
  if (value < 80) return "bad";
  if (value < 90) return "watch";
  return "good";
}

function tag(text, type = "neutral") {
  return `<span class="tag ${type}">${text}</span>`;
}

function shorten(text, maxLength = 165) {
  const value = String(text || "");
  return value.length <= maxLength ? value : value.slice(0, maxLength - 1).trim() + "…";
}

function manningTotals(dept = null) {
  const rows = dept ? byDept(MANNING, dept) : MANNING;
  const ba = sum(rows.map(r => r.supervisor[0] + r.journeyman[0] + r.apprentice[0]));
  const cob = sum(rows.map(r => r.supervisor[1] + r.journeyman[1] + r.apprentice[1]));
  return { ba, cob, pct: fillPct(cob, ba) };
}

function header(title, page) {
  const pageText = typeof page === "number"
    ? `Page ${page} of ${TOTAL_PAGES}`
    : "Reference Appendix";

  return `
    <header class="page-header">
      <div class="brand">
        Ship Readiness Dashboard
        <small>${title}</small>
      </div>
      <div class="ship-id">
        <strong>${SHIP.name}</strong>
        <span>${SHIP.hull} · UIC ${SHIP.uic} · ${SHIP.reportDate} · ${pageText}</span>
      </div>
    </header>
  `;
}

function footer() {
  return `
    <footer class="footer">
      <span>Embedded source trackers: Manning · NEC · Mission Area · CASREP · TSO · DFS · Parts Requisition</span>
      <span>BA = Billets Authorized · COB = Current On Board · RE = Readiness Evaluation</span>
    </footer>
  `;
}

function relatedTSO(dept, casrep) {
  const equipment = casrep.equipment.toLowerCase();

  return byDept(TSO, dept).filter(row => {
    const ref = (row.related + " " + row.text).toLowerCase();

    if (equipment.includes("fire") && ref.includes("firemain")) return true;
    if (equipment.includes("gtg") && (ref.includes("gtg") || ref.includes("engineering-plant"))) return true;
    if (equipment.includes("spy") && ref.includes("spy")) return true;
    if (equipment.includes("mk 45") && ref.includes("mk 45")) return true;
    if (equipment.includes("galley") && ref.includes("galley")) return true;
    if (equipment.includes("refrigerator") && ref.includes("refriger")) return true;
    if (equipment.includes("link-16") && ref.includes("data-link")) return true;
    if (equipment.includes("an/wsn") && ref.includes("navigation")) return true;

    return false;
  });
}

function relatedDFS(dept, casrep) {
  const equipment = casrep.equipment.toLowerCase();

  return byDept(DFS, dept).filter(row => {
    const ref = (row.related + " " + row.text).toLowerCase();

    if (equipment.includes("spy") && ref.includes("spy")) return true;
    if (equipment.includes("mk 41") && ref.includes("mk 41")) return true;
    if (equipment.includes("gtg") && ref.includes("gtm")) return true;

    return false;
  });
}

function materialStatus(part) {
  if (!part) return { label:"No linked requisition", type:"unlinked" };

  const value = String(part.status).toLowerCase();

  if (value.includes("backorder")) return { label:"Backordered", type:"unlinked" };
  if (value.includes("transit")) return { label:"In transit", type:"related" };
  if (value.includes("available")) return { label:"Available", type:"linked" };

  return { label:part.status, type:"related" };
}

function renderOverview() {
  const manning = manningTotals();
  const sig = CASREPS.filter(significant);
  const allGaps = gaps(NEC);
  const uncertified = MISSION.filter(r => !r.certified);
  const lowRE = MISSION.filter(r => r.re < 80);
  const noTeam = MISSION.filter(r => !r.team);
  const directPartLinks = CASREPS.filter(c => PARTS.some(p => p.casrep === c.n));
  const backlog = PARTS.filter(p => String(p.status).toLowerCase().includes("backorder"));

  const readinessIndex = Math.max(0, Math.round(
    (manning.pct * .24) +
    ((100 - sig.length * 8) * .24) +
    ((100 - allGaps.length * 2.5) * .18) +
    ((100 - lowRE.length * 4) * .14) +
    ((100 - uncertified.length * 12) * .10) +
    ((100 - noTeam.length * 7) * .10)
  ));

  const ringColor =
    readinessIndex >= 85 ? "var(--green)" :
    readinessIndex >= 75 ? "var(--amber)" :
    "var(--red)";

  const departmentBars = Object.keys(DEPTS).map(dept => {
    const total = manningTotals(dept);
    const concerns =
      byDept(CASREPS, dept).filter(significant).length +
      gaps(byDept(NEC, dept)).length +
      byDept(MISSION, dept).filter(m => !m.certified || m.re < 80 || !m.team).length;

    return `
      <div class="dept-row">
        <strong>${DEPTS[dept].short}</strong>
        <div class="track"><div class="fill" style="width:${total.pct}%;background:${DEPTS[dept].color}"></div></div>
        <div class="metric">${total.pct}%</div>
        <div class="metric" style="color:${concerns ? "var(--red)" : "var(--green)"}">${concerns}</div>
      </div>
    `;
  }).join("");

  const heatRows = Object.keys(DEPTS).map(dept => {
    const mission = byDept(MISSION, dept);
    const casreps = byDept(CASREPS, dept);
    const average = mission.length ? Math.round(sum(mission.map(m => m.re)) / mission.length) : 0;
    const hasUncert = mission.some(m => !m.certified);
    const below = mission.filter(m => m.re < 80).length;
    const noTraining = mission.some(m => !m.team);
    const sigCount = casreps.filter(significant).length;

    return `
      <div class="heat-label">${DEPTS[dept].short}</div>
      <div class="heat ${statusForPercent(average)}-bg">${average || "—"}${average ? "%" : ""}</div>
      <div class="heat ${hasUncert ? "bad-bg" : "good-bg"}">${hasUncert ? "FLAG" : "OK"}</div>
      <div class="heat ${below ? "watch-bg" : "good-bg"}">${below || "OK"}</div>
      <div class="heat ${noTraining ? "watch-bg" : "good-bg"}">${noTraining ? "FLAG" : "OK"}</div>
      <div class="heat ${sigCount ? "bad-bg" : "good-bg"}">${sigCount || "OK"}</div>
    `;
  }).join("");

  const priorities = [
    ...CASREPS.filter(significant).map(c => ({
      label:`${c.category} ${c.equipment}`,
      detail:`${DEPTS[c.dept].short} · ${c.mission} · ETR ${c.etr}`,
      score:c.category === "C4" ? 1 : 2
    })),
    ...MISSION.filter(m => m.re < 75).map(m => ({
      label:`${m.mission} RE ${m.re}%`,
      detail:`${DEPTS[m.dept].short} mission area below threshold`,
      score:3
    }))
  ]
  .sort((a,b) => a.score - b.score)
  .slice(0,5)
  .map((p, i) => `
    <div class="priority">
      <div class="priority-number">${i + 1}</div>
      <div><strong>${p.label}</strong><span>${p.detail}</span></div>
    </div>
  `).join("");

  return `
    <section class="page" id="overview">
      ${header("Ship Overview", 1)}

      <div class="section-title">Command Readiness Snapshot</div>

      <div class="grid overview-top">
        <div class="kpi-grid">
          <div class="kpi ${statusForPercent(manning.pct)}">
            <div class="kpi-label">Manning BA vs COB</div>
            <div class="kpi-value">${manning.cob} / ${manning.ba}</div>
            <div class="kpi-note">${manning.pct}% filled · ${manning.cob - manning.ba} billets vs BA</div>
          </div>

          <div class="kpi bad">
            <div class="kpi-label">Significant CASREPs</div>
            <div class="kpi-value">${sig.length}</div>
            <div class="kpi-note">C3/C4 material casualties</div>
          </div>

          <div class="kpi watch">
            <div class="kpi-label">NEC Gaps</div>
            <div class="kpi-value">${allGaps.length}</div>
            <div class="kpi-note">${NEC.length} NEC requirements assessed</div>
          </div>

          <div class="kpi ${uncertified.length ? "bad" : "good"}">
            <div class="kpi-label">Uncertified Mission Areas</div>
            <div class="kpi-value">${uncertified.length}</div>
            <div class="kpi-note">${uncertified.map(m => m.mission).join(", ") || "None"}</div>
          </div>

          <div class="kpi watch">
            <div class="kpi-label">Mission Areas RE Below 80%</div>
            <div class="kpi-value">${lowRE.length}</div>
            <div class="kpi-note">Readiness Evaluation threshold</div>
          </div>

          <div class="kpi watch">
            <div class="kpi-label">Areas Without Training Team</div>
            <div class="kpi-value">${noTeam.length}</div>
            <div class="kpi-note">${noTeam.map(m => m.mission).join(", ")}</div>
          </div>
        </div>

        <section class="panel">
          <div class="panel-header">
            <h3>Composite Readiness Index</h3>
            <span>Decision support</span>
          </div>

          <div class="panel-body">
            <div class="readiness">
              <div class="ring" style="background:conic-gradient(${ringColor} ${readinessIndex * 3.6}deg,#dfe8ec 0)">
                <strong>${readinessIndex}</strong>
                <span>Index</span>
              </div>

              <div class="readiness-copy">
                <strong>${readinessIndex < 75 ? "COMMAND ATTENTION REQUIRED" : "WATCH ITEMS PRESENT"}</strong>
                Index weights manning, significant CASREPs, NEC shortages, mission-area qualification health, and training-team availability.

                <div class="legend">
                  <span><i style="background:var(--green)"></i>85–100 stable</span>
                  <span><i style="background:var(--amber)"></i>75–84 watch</span>
                  <span><i style="background:var(--red)"></i>&lt;75 attention</span>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <div class="grid overview-bottom">
        <section class="panel">
          <div class="panel-header">
            <h3>Department Manning and Concern Load</h3>
            <span>Right value = readiness flags</span>
          </div>

          <div class="panel-body">
            ${departmentBars}
            <div class="legend">
              <span>Bar = manning fill percentage</span>
              <span>Flags = C3/C4 + NEC gaps + mission exceptions</span>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h3>Mission-Area Heat Map</h3>
            <span>Department roll-up</span>
          </div>

          <div class="panel-body">
            <div class="heatmap">
              <div></div>
              <div class="heat-head">Avg RE</div>
              <div class="heat-head">Cert</div>
              <div class="heat-head">RE&lt;80</div>
              <div class="heat-head">Team</div>
              <div class="heat-head">C3/C4</div>
              ${heatRows}
            </div>
          </div>

        <section class="panel">
          <div class="panel-header">
            <h3>Priority Watch List</h3>

          </div>

        </section>
      </div>

      <div class="section-title">Concern-to-Control Tracker Health</div>

      <div class="grid" style="grid-template-columns:repeat(4,1fr)">
        <div class="stat bad">
          <label>Direct CASREP-to-Part Links</label>
          <strong>${directPartLinks.length} / ${CASREPS.length}</strong>
          <span>Numeric CASREP link in requisition tracker</span>
        </div>

        <div class="stat watch">
          <label>Backordered Parts</label>
          <strong>${backlog.length}</strong>
          <span>CASREP and planned-maintenance demand</span>
        </div>

        <div class="stat watch">
          <label>Active TSOs</label>
          <strong>${TSO.length}</strong>
          <span>Standing operational risk controls</span>
        </div>

        <div class="stat watch">
          <label>Approved DFSs</label>
          <strong>${DFS.length}</strong>
          <span>Approved deviations and limits</span>

      <div class="callout" style="margin-top:8px">
        <strong>Command focus:</strong>
        Material-risk control is strongest where a CASREP has a direct requisition number, identified material status, and a specific operational mitigation.
        Department pages show the casualty-to-control chain. The appendix consolidates every CASREP, TSO, DFS, and parts record.
      </div>

      ${footer()}
    </section>
  `;
}

/* ============================================================
   DEPARTMENT PAGE FUNCTIONS
   ============================================================ */

function renderManning(dept) {
  const row = byDept(MANNING, dept)[0];

  const tiers = [
    ["Supervisor", row.supervisor],
    ["Journeyman", row.journeyman],
    ["Apprentice", row.apprentice]
  ];

  const max = Math.max(...tiers.map(t => t[1][0]));

  return tiers.map(([label, data]) => `
    <div class="manning-row">
      <strong>${label}</strong>
      <div class="manning-bar">
        <div class="manning-ba" style="width:${data[0] / max * 100}%"></div>
        <div class="manning-cob" style="width:${data[1] / max * 100}%"></div>
      </div>
      <span class="metric">${data[1]}/${data[0]}</span>
    </div>
  `).join("");
}

function renderMissionCompact(dept) {
  const missions = byDept(MISSION, dept);

  if (!missions.length) return `<div class="empty">No mission areas mapped to this department.</div>`;

  const averageRE = Math.round(sum(missions.map(m => m.re)) / missions.length);
  const uncertified = missions.filter(m => !m.certified).length;
  const belowThreshold = missions.filter(m => m.re < 80).length;
  const noTrainingTeam = missions.filter(m => !m.team).length;
  const goodCount = missions.filter(m => m.re >= 90).length;
  const watchCount = missions.filter(m => m.re >= 80 && m.re < 90).length;
  const badCount = missions.filter(m => m.re < 80).length;
  const total = missions.length || 1;

  return `
    <div class="mission-summary">
      <div class="mission-summary-box ${statusForPercent(averageRE)}">
        <label>Average RE</label>
        <strong>${averageRE}%</strong>
      </div>

      <div class="mission-summary-box ${uncertified ? "bad" : "good"}">
        <label>Uncertified</label>
        <strong>${uncertified}</strong>
      </div>

      <div class="mission-summary-box ${belowThreshold ? "watch" : "good"}">
        <label>RE Below 80%</label>
        <strong>${belowThreshold}</strong>
      </div>

      <div class="mission-summary-box ${noTrainingTeam ? "watch" : "good"}">
        <label>No Training Team</label>
        <strong>${noTrainingTeam}</strong>
      </div>
    </div>

    <div class="mission-summary-bar">
      <span style="width:${goodCount / total * 100}%;background:var(--green)"></span>
      <span style="width:${watchCount / total * 100}%;background:var(--amber)"></span>
      <span style="width:${badCount / total * 100}%;background:var(--red)"></span>
    </div>

    <div class="legend" style="margin-top:3px">
      <span><i style="background:var(--green)"></i>RE ≥90</span>
      <span><i style="background:var(--amber)"></i>RE 80–89</span>
      <span><i style="background:var(--red)"></i>RE &lt;80</span>
    </div>
  `;
}

function renderNEC(dept) {
  const rows = byDept(NEC, dept).sort((a,b) => (a.cob - a.ba) - (b.cob - b.ba));

  if (!rows.length) return `<div class="empty">No NEC requirements assigned.</div>`;

  return rows.map(n => {
    const pct = n.ba ? n.cob / n.ba * 100 : 0;

    return `
      <div class="nec-row">
        <strong>${n.code}</strong>
        <div class="nec-stack">
          <div class="nec-filled" style="width:${pct}%"></div>
          <div class="nec-gap" style="width:${100 - pct}%"></div>
        </div>
        <span class="metric">${n.cob}/${n.ba}</span>
      </div>
    `;
  }).join("");
}

function renderPartsTable(dept) {
  const rows = byDept(PARTS, dept).filter(r => r.casrep);

  if (!rows.length) return `<div class="empty">No CASREP-linked requisitions assigned.</div>`;

  return `
    <table>
      <thead>
        <tr>
          <th>CASREP</th>
          <th>Part / Requisition</th>
          <th>Pri</th>
          <th>Status</th>
          <th>ETA</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(p => `
          <tr>
            <td><strong>${p.casrep}</strong></td>
            <td>${p.item}<br><span style="color:var(--muted)">${p.req}</span></td>
            <td class="center">${p.priority}</td>
            <td>${p.status}</td>
            <td>${p.eta}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
}

function renderConcernChain(casrep) {
  const partRecords = PARTS.filter(p => p.casrep === casrep.n);
  const part = partRecords[0];
  const material = materialStatus(part);
  const tsos = relatedTSO(casrep.dept, casrep);
  const dfss = relatedDFS(casrep.dept, casrep);

  let controlText = "No TSO/DFS relationship identified.";
  let controlType = "unlinked";

  if (dfss.length) {
    controlText = `${dfss[0].n}: ${dfss[0].type}`;
    controlType = "related";
  } else if (tsos.length) {
    controlText = `${tsos[0].n}: Active TSO`;
    controlType = "related";
  }

  return `
    <article class="concern ${casrep.category.toLowerCase()}">
      <div class="concern-head">
        <span>${casrep.category} · CASREP ${casrep.n} · ${casrep.equipment}</span>
        <span>ETR ${casrep.etr}</span>
      </div>

      <div class="concern-copy">${casrep.description}</div>

      <div class="chain">
        <div class="chain-box">
          <strong>1. Operational Effect</strong>
          ${casrep.mission}<br>
          ${casrep.redline ? "TYCOM redline" : "No TYCOM redline"} ·
          ${casrep.tech ? "Tech assist" : "Ship's force"}
        </div>

        <div class="chain-arrow">→</div>

        <div class="chain-box ${material.type}">
          <strong>2. Material Recovery</strong>
          ${part ? `${part.item}<br>${material.label} · ETA ${part.eta}` : "No direct requisition linked"}
        </div>

        <div class="chain-arrow">→</div>

        <div class="chain-box ${controlType}">
          <strong>3. Risk Control</strong>
          ${controlText}<br>
          ${tsos.length || dfss.length ? "Equipment/department related" : "No source relationship"}
        </div>
      </div>
    </article>
  `;
}

function renderDepartment(dept, pageNumber) {
  const info = DEPTS[dept];
  const total = manningTotals(dept);
  const departmentCASREPs = byDept(CASREPS, dept);
  const sig = departmentCASREPs.filter(significant);
  const departmentNEC = byDept(NEC, dept);
  const departmentGaps = gaps(departmentNEC);
  const departmentMission = byDept(MISSION, dept);
  const missionFlags = departmentMission.filter(m => !m.certified || m.re < 80 || !m.team);
  const backorders = byDept(PARTS, dept).filter(p =>
    String(p.status).toLowerCase().includes("backorder")
  );

  const severity = { C4:1, C3:2, C2:3, C1:4 };

  const departmentConcerns = [...departmentCASREPs]
    .sort((a, b) => severity[a.category] - severity[b.category]);

  return `
    <section class="page department-page" id="${dept}">
      ${header(`${info.name} Department`, pageNumber)}

      <div class="grid department-top">
        <div class="stat ${statusForPercent(total.pct)}">
          <label>Manning BA / COB</label>
          <strong>${total.cob} / ${total.ba}</strong>
          <span>${total.pct}% filled</span>
        </div>

        <div class="stat ${sig.length ? "bad" : "good"}">
          <label>Significant CASREPs</label>
          <strong>${sig.length}</strong>
          <span>${departmentCASREPs.length} total material casualties</span>
        </div>

        <div class="stat ${departmentGaps.length ? "watch" : "good"}">
          <label>NEC Gaps</label>
          <strong>${departmentGaps.length}</strong>
          <span>${departmentNEC.length} requirements assessed</span>
        </div>

        <div class="stat ${missionFlags.length ? "watch" : "good"}">
          <label>Mission Exceptions</label>
          <strong>${missionFlags.length}</strong>
          <span>Cert, RE, or training-team flags</span>
        </div>

        <div class="stat ${backorders.length ? "bad" : "good"}">
          <label>Parts Backordered</label>
          <strong>${backorders.length}</strong>
          <span>CASREP and maintenance demand</span>
        </div>
      </div>

      <div class="grid department-mid">
        <section class="panel">
          <div class="panel-header">
            <h3>Manning Composition</h3>
            <span>Blue = COB · Gray = BA</span>
          </div>
          <div class="panel-body">${renderManning(dept)}</div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h3>Mission-Area Readiness Summary</h3>
            <span>Detailed assessment on Overview</span>
          </div>
          <div class="panel-body">${renderMissionCompact(dept)}</div>
        </section>
      </div>

      <div class="section-title">Casualty-to-Control Chain</div>

      <section class="chain-section">
        <div class="panel">
          <div class="panel-header">
            <h3>Material Casualty → Recovery Action → Operational Risk Control</h3>
            <span>All department CASREPs</span>
          </div>

          <div class="panel-body">
            ${departmentConcerns.length
              ? departmentConcerns.map(renderConcernChain).join("")
              : `<div class="empty">No CASREPs assigned to this department.</div>`}
          </div>
        </div>
      </section>

      <div class="grid department-bottom">
        <section class="panel">
          <div class="panel-header">
            <h3>NEC Health</h3>
            <span>Green = COB · Red = shortage to BA</span>
          </div>
          <div class="panel-body">${renderNEC(dept)}</div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h3>CASREP-Linked Parts Requisitions</h3>
            <span>Material tracker</span>
          </div>
          <div class="panel-body" style="padding:0">${renderPartsTable(dept)}</div>
        </section>
      </div>

      ${footer()}
    </section>
  `;
}

/* ============================================================
   CONTINUOUS MATERIAL ISSUE MASTER REGISTER
   ============================================================ */

function formatControls(tsos, dfss) {
  const controls = [
    ...tsos.map(t => `${t.n} (TSO)`),
    ...dfss.map(d => `${d.n} (${d.type})`)
  ];

  return controls.length ? controls.join("<br>") : "No related TSO/DFS identified.";
}

function buildIssueRegister() {
  const usedTSO = new Set();
  const usedDFS = new Set();

  const casrepRows = CASREPS.map(casrep => {
    const parts = PARTS.filter(part => part.casrep === casrep.n);
    const tsos = relatedTSO(casrep.dept, casrep);
    const dfss = relatedDFS(casrep.dept, casrep);

    tsos.forEach(t => usedTSO.add(t.n));
    dfss.forEach(d => usedDFS.add(d.n));

    const partText = parts.length
      ? parts.map(p => `${p.item}; ${p.req}; ${p.status}; ETA ${p.eta}`).join("<br>")
      : "No direct requisition.";

    const hasBackorder = parts.some(p =>
      String(p.status).toLowerCase().includes("backorder")
    );

    const relatedText = [
      ...tsos.map(t => t.related),
      ...dfss.map(d => d.related)
    ].join("; ");

    return {
      source: `CASREP ${casrep.n}<br>${tag(casrep.category, significant(casrep) ? "bad" : "watch")}`,
      dept: DEPTS[casrep.dept].short,
      issue: `<strong>${casrep.equipment}</strong><br>${casrep.mission}`,
      effect: shorten(casrep.description),
      parts: partText,
      controls: `${formatControls(tsos, dfss)}<br><span style="color:var(--muted)">${shorten(relatedText || "No source relationship.", 115)}</span>`,
      status: `
        ETR ${casrep.etr}
        <span class="appendix-status" style="color:${hasBackorder ? "var(--red)" : "var(--green)"}">
          ${parts.length
            ? (hasBackorder ? "DIRECT PART LINK · BACKORDER" : "DIRECT PART LINK")
            : "NO PART LINK"}
        </span>
      `
    };
  });

  const standaloneTSO = TSO
    .filter(t => !usedTSO.has(t.n))
    .map(t => ({
      source: `${t.n}<br>${tag("TSO", "watch")}`,
      dept: DEPTS[t.dept].short,
      issue: `<strong>Standing Risk Control</strong><br>${t.related}`,
      effect: shorten(t.text),
      parts: "No specific material requisition.",
      controls: `Active TSO<br><span style="color:var(--muted)">${t.related}</span>`,
      status: `<span class="appendix-status" style="color:var(--amber)">CONTROL-ONLY CONDITION</span>`
    }));

  const standaloneDFS = DFS
    .filter(d => !usedDFS.has(d.n))
    .map(d => ({
      source: `${d.n}<br>${tag("DFS", "watch")}`,
      dept: DEPTS[d.dept].short,
      issue: `<strong>Approved Deviation</strong><br>${d.related}`,
      effect: shorten(d.text),
      parts: "No specific material requisition.",
      controls: `${d.type}<br><span style="color:var(--muted)">${d.related}</span>`,
      status: `<span class="appendix-status" style="color:var(--amber)">APPROVED DFS</span>`
    }));

  const standaloneParts = PARTS
    .filter(p => !p.casrep)
    .map(p => ({
      source: `${p.req}<br>${tag("PARTS", "neutral")}`,
      dept: DEPTS[p.dept].short,
      issue: `<strong>${p.item}</strong><br>${shorten(p.remarks, 90)}`,
      effect: "Planned maintenance, replenishment, or non-CASREP material demand.",
      parts: `${p.qty} ea; Priority ${p.priority}; ${p.status}; ETA ${p.eta}; ${p.source}`,
      controls: "No directly associated TSO/DFS identified.",
      status: `<span class="appendix-status" style="color:${
        String(p.status).toLowerCase().includes("backorder")
          ? "var(--red)"
          : "var(--green)"
      }">NON-CASREP MATERIAL DEMAND</span>`
    }));

  return [
    ...casrepRows,
    ...standaloneTSO,
    ...standaloneDFS,
    ...standaloneParts
  ];
}

function renderIssueRegister() {
  const rows = buildIssueRegister();

  return `
    <section class="appendix-continuous" id="appendix">
      ${header("Material Issue Master Register", "Appendix")}

      <div class="section-title">Consolidated Material, CASREP, TSO, DFS, and Parts Reference Table</div>

      <div class="appendix-intro">
        <strong>Reference use:</strong> Each row represents one casualty, condition, approved deviation,
        standing risk control, or material requirement. CASREP rows incorporate linked parts requisitions
        and related TSO/DFS controls. A <strong>Direct Part Link</strong> means the numeric CASREP identifier
        appears in the parts tracker. TSO/DFS associations are marked as related when tied by department,
        equipment, or operational effect rather than an exact CASREP number.
      </div>

      <table class="appendix-table">
        <thead>
          <tr>
            <th class="source-col">Source / Dept</th>
            <th class="issue-col">Material Issue or Condition</th>
            <th class="effect-col">Operational Effect or Requirement</th>
            <th class="parts-col">Parts / Recovery Tracker</th>
            <th class="control-col">TSO / DFS Control</th>
            <th class="status-col">Link / Recovery Status</th>
          </tr>
        </thead>

        <tbody>
          ${rows.map(row => `
            <tr>
              <td>${row.source}<br><strong>${row.dept}</strong></td>
              <td>${row.issue}</td>
              <td>${row.effect}</td>
              <td>${row.parts}</td>
              <td>${row.controls}</td>
              <td>${row.status}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>

      <div class="appendix-note">
        This is one continuous table. When printed, the browser will flow the table over the minimum number
        of additional landscape pages required and repeat the column headers.
      </div>

      ${footer()}
    </section>
  `;
}

document.getElementById("report").innerHTML =

  renderDepartment("eng", 2) +
  renderDepartment("ops", 3) +
  renderDepartment("cs", 4) +

</script>
<style>

    letter-spacing: .15px;
    text-transform: uppercase;
  }

  .priority-flag.crr {
    color: #6a4800;
    background: #fff0ca;
  }
</style>

<script>
/* ============================================================
   OVERVIEW OVERRIDE — ADDS TYCOM REDLINE / FLEET CRR METRIC
   ============================================================ */

function renderOverview() {
  const manning = manningTotals();
  const sig = CASREPS.filter(significant);
  const allGaps = gaps(NEC);
  const uncertified = MISSION.filter(r => !r.certified);
  const lowRE = MISSION.filter(r => r.re < 80);
  const noTeam = MISSION.filter(r => !r.team);

  /* A CASREP is counted once if it is a TYCOM Redline, a Fleet
     CRR, or both. */
  const elevatedCASREPs = CASREPS.filter(c => c.redline || c.fleet);
  const tycomRedlines = CASREPS.filter(c => c.redline);
  const fleetCRRs = CASREPS.filter(c => c.fleet);

  const directPartLinks = CASREPS.filter(c => PARTS.some(p => p.casrep === c.n));
  const backlog = PARTS.filter(p =>
    String(p.status).toLowerCase().includes("backorder")
  );

  const readinessIndex = Math.max(0, Math.round(
    (manning.pct * .24) +
    ((100 - sig.length * 8) * .24) +
    ((100 - allGaps.length * 2.5) * .18) +
    ((100 - lowRE.length * 4) * .14) +
    ((100 - uncertified.length * 12) * .10) +
    ((100 - noTeam.length * 7) * .10)
  ));

  const ringColor =
    readinessIndex >= 85 ? "var(--green)" :
    readinessIndex >= 75 ? "var(--amber)" :
    "var(--red)";

  const departmentBars = Object.keys(DEPTS).map(dept => {
    const total = manningTotals(dept);

    const concerns =
      byDept(CASREPS, dept).filter(significant).length +
      byDept(CASREPS, dept).filter(c => c.redline || c.fleet).length +
      gaps(byDept(NEC, dept)).length +
      byDept(MISSION, dept).filter(m => !m.certified || m.re < 80 || !m.team).length;

    return `
      <div class="dept-row">
        <strong>${DEPTS[dept].short}</strong>
        <div class="track">
          <div class="fill" style="width:${total.pct}%;background:${DEPTS[dept].color}"></div>
        </div>
        <div class="metric">${total.pct}%</div>
        <div class="metric" style="color:${concerns ? "var(--red)" : "var(--green)"}">${concerns}</div>
      </div>
    `;
  }).join("");

  const heatRows = Object.keys(DEPTS).map(dept => {
    const mission = byDept(MISSION, dept);
    const casreps = byDept(CASREPS, dept);
    const average = mission.length
      ? Math.round(sum(mission.map(m => m.re)) / mission.length)
      : 0;

    const hasUncert = mission.some(m => !m.certified);
    const below = mission.filter(m => m.re < 80).length;
    const noTraining = mission.some(m => !m.team);
    const sigCount = casreps.filter(significant).length;
    const elevatedCount = casreps.filter(c => c.redline || c.fleet).length;

    return `
      <div class="heat-label">${DEPTS[dept].short}</div>
      <div class="heat ${statusForPercent(average)}-bg">${average || "—"}${average ? "%" : ""}</div>
      <div class="heat ${hasUncert ? "bad-bg" : "good-bg"}">${hasUncert ? "FLAG" : "OK"}</div>
      <div class="heat ${below ? "watch-bg" : "good-bg"}">${below || "OK"}</div>
      <div class="heat ${noTraining ? "watch-bg" : "good-bg"}">${noTraining ? "FLAG" : "OK"}</div>
      <div class="heat ${(sigCount || elevatedCount) ? "bad-bg" : "good-bg"}">
        ${sigCount || elevatedCount ? `${sigCount}/${elevatedCount}` : "OK"}
      </div>
    `;
  }).join("");

  const severity = { C4: 1, C3: 2, C2: 3, C1: 4 };

  /* Priority Watch List includes all significant CASREPs and
     Redline/CRR records, then readiness areas below 75% RE. */
  const priorityCasreps = CASREPS
    .filter(c => significant(c) || c.redline || c.fleet)
    .sort((a, b) => {
      const aScore = severity[a.category] * 10 - (a.redline ? 3 : 0) - (a.fleet ? 2 : 0);
      const bScore = severity[b.category] * 10 - (b.redline ? 3 : 0) - (b.fleet ? 2 : 0);
      return aScore - bScore;
    })
    .map(c => {
      const flags = [
        c.redline ? `<span class="priority-flag">TYCOM Redline</span>` : "",
        c.fleet ? `<span class="priority-flag crr">Fleet CRR</span>` : ""
      ].join("");

      return {
        label: `${c.category} ${c.equipment}`,
        detail: `${DEPTS[c.dept].short} · ${c.mission} · ETR ${c.etr}<br>${flags}`,
        score: severity[c.category] * 10 - (c.redline ? 3 : 0) - (c.fleet ? 2 : 0)
      };
    });

  const priorityMissionAreas = MISSION
    .filter(m => m.re < 75)
    .map(m => ({
      label: `${m.mission} RE ${m.re}%`,
      detail: `${DEPTS[m.dept].short} mission area below threshold`,
      score: 50
    }));

  const priorities = [
    ...priorityCasreps,
    ...priorityMissionAreas
  ]
  .sort((a, b) => a.score - b.score)
  .slice(0, 5)
  .map((p, i) => `
    <div class="priority">
      <div class="priority-number">${i + 1}</div>
      <div>
        <strong>${p.label}</strong>
        <span>${p.detail}</span>
      </div>
    </div>
  `).join("");

  return `
    <section class="page" id="overview">
      ${header("Ship Overview", 1)}

      <div class="section-title">Command Readiness Snapshot</div>

      <div class="grid overview-top">
        <div class="kpi-grid">
          <div class="kpi ${statusForPercent(manning.pct)}">
            <div class="kpi-label">Manning BA vs COB</div>
            <div class="kpi-value">${manning.cob} / ${manning.ba}</div>
            <div class="kpi-note">${manning.pct}% filled · ${manning.cob - manning.ba} billets vs BA</div>
          </div>

          <div class="kpi bad">
            <div class="kpi-label">Significant CASREPs</div>
            <div class="kpi-value">${sig.length}</div>
            <div class="kpi-note">C3/C4 material casualties</div>
          </div>

          <div class="kpi bad">
            <div class="kpi-label">TYCOM Redline / Fleet CRR CASREPs</div>
            <div class="kpi-value">${elevatedCASREPs.length}</div>
            <div class="kpi-note">${tycomRedlines.length} Redline · ${fleetCRRs.length} Fleet CRR</div>
          </div>

          <div class="kpi watch">
            <div class="kpi-label">NEC Gaps</div>
            <div class="kpi-value">${allGaps.length}</div>
            <div class="kpi-note">${NEC.length} NEC requirements assessed</div>
          </div>

          <div class="kpi ${uncertified.length ? "bad" : "good"}">
            <div class="kpi-label">Uncertified Mission Areas</div>
            <div class="kpi-value">${uncertified.length}</div>
            <div class="kpi-note">${uncertified.map(m => m.mission).join(", ") || "None"}</div>
          </div>

          <div class="kpi watch">
            <div class="kpi-label">Mission Areas RE Below 80%</div>
            <div class="kpi-value">${lowRE.length}</div>
            <div class="kpi-note">Readiness Evaluation threshold</div>
          </div>

          <div class="kpi watch">
            <div class="kpi-label">Areas Without Training Team</div>
            <div class="kpi-value">${noTeam.length}</div>
            <div class="kpi-note">${noTeam.map(m => m.mission).join(", ")}</div>
          </div>
        </div>

        <section class="panel">
          <div class="panel-header">
            <h3>Composite Readiness Index</h3>
            <span>Decision support</span>
          </div>

          <div class="panel-body">
            <div class="readiness">
              <div class="ring" style="background:conic-gradient(${ringColor} ${readinessIndex * 3.6}deg,#dfe8ec 0)">
                <strong>${readinessIndex}</strong>
                <span>Index</span>
              </div>

              <div class="readiness-copy">
                <strong>${readinessIndex < 75 ? "COMMAND ATTENTION REQUIRED" : "WATCH ITEMS PRESENT"}</strong>
                Index weights manning, significant CASREPs, NEC shortages, mission-area qualification health, and training-team availability.

                <div class="legend">
                  <span><i style="background:var(--green)"></i>85–100 stable</span>
                  <span><i style="background:var(--amber)"></i>75–84 watch</span>
                  <span><i style="background:var(--red)"></i>&lt;75 attention</span>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <div class="grid overview-bottom">
        <section class="panel">
          <div class="panel-header">
            <h3>Department Manning and Concern Load</h3>
            <span>Right value = readiness flags</span>
          </div>

          <div class="panel-body">
            ${departmentBars}
            <div class="legend">
              <span>Bar = manning fill percentage</span>
              <span>Flags include C3/C4, Redline/CRR, NEC, and mission exceptions</span>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h3>Mission-Area Heat Map</h3>
            <span>Last column = C3/C4 / Redline-CRR</span>
          </div>

          <div class="panel-body">
            <div class="heatmap">
              <div></div>
              <div class="heat-head">Avg RE</div>
              <div class="heat-head">Cert</div>
              <div class="heat-head">RE&lt;80</div>
              <div class="heat-head">Team</div>
              <div class="heat-head">Sig / RL</div>
              ${heatRows}
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h3>Priority Watch List</h3>
            <span>Redline and CRR indicators shown</span>
          </div>

          <div class="panel-body">${priorities}</div>
        </section>
      </div>

      <div class="section-title">Concern-to-Control Tracker Health</div>

      <div class="grid" style="grid-template-columns:repeat(4,1fr)">
        <div class="stat bad">
          <label>Direct CASREP-to-Part Links</label>
          <strong>${directPartLinks.length} / ${CASREPS.length}</strong>
          <span>Numeric CASREP link in requisition tracker</span>
        </div>

        <div class="stat bad">
          <label>TYCOM Redline / Fleet CRR</label>
          <strong>${elevatedCASREPs.length}</strong>
          <span>Unique CASREPs with elevated command reporting</span>
        </div>

        <div class="stat watch">
          <label>Backordered Parts</label>
          <strong>${backlog.length}</strong>
          <span>CASREP and planned-maintenance demand</span>
        </div>

        <div class="stat watch">
          <label>Active Controls</label>
          <strong>${TSO.length + DFS.length}</strong>
          <span>${TSO.length} TSO · ${DFS.length} DFS</span>
        </div>
      </div>

      <div class="callout" style="margin-top:8px">
        <strong>Command focus:</strong>
        ${elevatedCASREPs.length} unique CASREP(s) carry a TYCOM Redline and/or Fleet CRR indicator.
        These casualties are prioritized in the watch list and should be reviewed for operational impact,
        recovery path, external support, material status, and controlling TSO/DFS measures.
      </div>

      ${footer()}
    </section>
  `;
}

/* Rebuild the complete report using the enhanced Overview. */
document.getElementById("report").innerHTML =
  renderOverview() +
  renderDepartment("eng", 2) +
  renderDepartment("ops", 3) +
  renderDepartment("cs", 4) +
  renderDepartment("weps", 5) +
  renderDepartment("sup", 6) +
  renderIssueRegister();
</script>
</body>
</html>
